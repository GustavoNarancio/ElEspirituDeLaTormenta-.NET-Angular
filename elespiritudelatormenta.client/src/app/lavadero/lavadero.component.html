<div class="contenedor-juego">
  <div class="area-interactiva lavadero-fondo">

    <h1 class="titulo-habitacion">Lavadero</h1>

    <app-mochila></app-mochila>

    <app-puzzle-fusibles *ngIf="mostrarPuzzleModal"
                         (cerrar)="cerrarPuzzle()">
    </app-puzzle-fusibles>

    <div class="menu-opciones">
      <span class="opcion-amarilla efecto-hover" (click)="alternarInspeccion()">Inspeccionar Objetos</span>
      <span class="opcion-amarilla efecto-hover" (click)="volver()">Volver atrás</span>
    </div>

    <div *ngIf="mostrarDescripcion" class="pantalla-lectura">
      <div class="contenedor-lectura-central">

        <img src="/assets/MarcoDeTextoCuadrado.png" class="fondo-lectura-transparente">

        <div class="contenido-texto-lectura">

          <p class="texto-descripcion-db">
            {{ textoLectura }}
          </p>

          <img src="/assets/Cerrar.png" class="boton-volver-lectura efecto-hover"(click)="cerrarLectura()" alt="Volver">
          
        </div>

      </div>
    </div>

    <div *ngIf="mostrarMenuInspeccion" class="panel-inferior">
      <img src="/assets/MarcoDeTextoRectangular.png" class="fondo-marco">

      <img src="/assets/Cerrar.png" class="boton-cerrar efecto-hover" (click)="alternarInspeccion()" alt="Cerrar">

      <div class="contenedor-lista-objetos">
        <div *ngFor="let obj of listaDeObjetosDB" class="objeto-lista" (click)="abrirAcciones(obj, 'objeto')">
          - {{ obj.nombre }}
        </div>
        <div *ngFor="let puz of listaDePuzzlesDB" class="objeto-lista" (click)="abrirAcciones(puz, 'puzzle')">
          - {{ puz.nombre }}
        </div>
      </div>

      <div *ngIf="mostrarMiniMenu" class="mini-menu-acciones">
        <img src="/assets/MarcoDeTextoCuadrado.png" class="fondo-cuadrado">

        <div class="contenido-acciones">

          <div class="opcion-accion efecto-hover" *ngIf="esPuzzle" (click)="interactuar()">
            - Interactuar
          </div>

          <div class="opcion-accion efecto-hover" *ngIf="!esPuzzle && itemSeleccionado?.esAgarrable" (click)="guardarItem()">
            - Guardar en Mochila
          </div>

          <div class="opcion-accion efecto-hover" (click)="verDescripcion()">
            - Ver Descripción
          </div>

          <img src="/assets/x.png" class="cerrar-mini efecto-hover" (click)="cerrarMiniMenu()" alt="Cerrar">
        </div>
      </div>

    </div>
  </div>
</div>
